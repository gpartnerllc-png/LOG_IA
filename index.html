<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel='icon' type='image/png' href='https://images.yampi.me/assets/stores/droppfy/uploads/icon/65f3d8c635540.png'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Droppfy | AI Logistics Global</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .ai-glow { box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }
        input, select { transition: all 0.2s ease; color: white; outline: none; }
        input:focus { border-color: #38bdf8 !important; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
        .hidden { display: none; }
        .torre-container { max-width: 450px; margin: 0 auto; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="torre-container">
        <header class="text-center mb-8 pb-6 border-b border-slate-700">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">DROPPFY LOGISTICS AI</h1>
            <p class="text-slate-400 text-xs">O Melhor Preço de Envio FullTime</p>
            <div class="mt-4">
                <span class="px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 text-[10px] font-mono tracking-tighter">SISTEMA ATIVO</span>
                <p class="text-[10px] text-slate-500 mt-2"><span id="currentDate">--/--/----</span> - <span id="currentTime" class="font-bold text-slate-300">00:00:00</span></p>
            </div>
        </header>

        <form id="formSandx" onsubmit="processarLogistica(event)" class="flex flex-col gap-6">
            
            <div class="glass p-5 rounded-2xl ai-glow space-y-4">
                <h2 class="text-lg font-semibold flex items-center"><span class="mr-2">📍</span> Destinação</h2>
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[9px] text-slate-400 mb-1 uppercase">CEP Origem</label>
                        <input type="text" id="cepOrigem" value="72915-484" class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-xs">
                    </div>
                    <div>
                        <label class="block text-[9px] text-slate-400 mb-1 uppercase">CEP Destino</label>
                        <input type="text" id="cepDestino" placeholder="00000-000" required class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-xs">
                    </div>
                </div>

                <div>
                    <label class="block text-[9px] text-slate-400 mb-1 uppercase">Nome Completo</label>
                    <input type="text" id="nomeCliente" required class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-xs">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[9px] text-slate-400 mb-1 uppercase">CPF/CNPJ</label>
                        <input type="text" id="docCliente" required placeholder="000.000..." class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-xs">
                    </div>
                    <div>
                        <label class="block text-[9px] text-slate-400 mb-1 uppercase">WhatsApp</label>
                        <input type="text" id="telCliente" required class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-xs">
                    </div>
                </div>

                <div>
                    <label class="block text-[9px] text-slate-400 mb-1 uppercase">Endereço e Número</label>
                    <input type="text" id="endereco" required class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-xs">
                </div>
            </div>

            <div class="glass p-5 rounded-2xl space-y-4">
                <h2 class="text-lg font-semibold flex items-center"><span class="mr-2">📦</span> Packing</h2>
                
                <div>
                    <label class="block text-[9px] text-slate-400 mb-1 uppercase">Dimensões (cm)</label>
                    <div class="flex gap-2">
                        <input type="number" id="alt" value="20" class="recalc w-full bg-slate-900 p-2 rounded border border-slate-700 text-xs text-center">
                        <input type="number" id="larg" value="20" class="recalc w-full bg-slate-900 p-2 rounded border border-slate-700 text-xs text-center">
                        <input type="number" id="comp" value="20" class="recalc w-full bg-slate-900 p-2 rounded border border-slate-700 text-xs text-center">
                    </div>
                </div>

                <div>
                    <label class="block text-[9px] text-slate-400 mb-1 uppercase">Peso e Serviço</label>
                    <select id="peso" class="recalc w-full bg-slate-900 p-2 rounded border border-slate-700 text-xs mb-2">
                        <option value="0.1">Até 100g</option>
                        <option value="0.2">Até 200g</option>
                        <option value="0.3">Até 300g</option>
                        <option value="0.4">Até 400g</option>
                        <option value="0.5">Até 500g</option>
                        <option value="1">Até 1kg</option>
                        <option value="5">Até 5kg</option>
                        <option value="10">Até 10kg</option>
                        <option value="15">Até 15kg</option>
                        <option value="20">Até 20kg</option>
                    </select>
                    <select id="servico" class="recalc w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-xs">
                        <option value="moto">🏍️ Droppfy Express (Same Day)</option>
                        <option value="04014">⚡ SEDEX (Fast)</option>
                        <option value="04510">📦 PAC (Economic)</option>
                    </select>
                    <p id="prazoVisual" class="text-[10px] text-emerald-400 mt-2 font-bold hidden text-center italic">⏰ PRAZO: <span id="prazoTexto"></span></p>
                </div>
            </div>

            <div class="glass p-5 rounded-2xl border-l-4 border-blue-500 space-y-4">
                <h2 class="text-lg font-semibold text-center">⚡ Checkout</h2>
                
                <div id="displayValores" class="hidden space-y-3 border-t border-slate-700 pt-4">
                    <div class="flex justify-between text-[10px] text-slate-400">
                        <span>Custo Logístico:</span>
                        <span id="valorBase">R$ 0,00</span>
                    </div>
                    <div class="flex justify-between text-xl font-bold text-emerald-400">
                        <span>Total Droppfy:</span>
                        <span id="valorFinal">R$ 0,00</span>
                    </div>
                    
                    <div id="areaPix" class="mt-4 p-3 bg-white rounded-xl text-center">
                        <p class="text-black text-[9px] font-black mb-2 uppercase">Escaneie para Pagar</p>
                        <img id="qrCodePix" src="" class="mx-auto w-32 h-32">
                    </div>

                    <button type="button" onclick="window.print()" class="w-full bg-green-600 text-white py-2 rounded-lg text-[10px] font-bold uppercase">
                        🖨️ Imprimir Declaração
                    </button>
                </div>
                
                <button type="submit" id="btnMain" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all text-sm">
                    CALCULAR E GERAR PIX
                </button>
                <p class="text-[8px] text-center text-slate-600 uppercase tracking-widest">SandxCDD Intelligence</p>
            </div>
        </form>
    </div>

    <script>
    const SANDX_CONFIG = {
        pix: "pago@droppfy.com",
        beneficiario: "Partner",
        cidade: "Aguas Lindas",
        token: "8539700676:AAH2YR3nb7uTyp2DUmeSqHRGZcQjU4anoVA",
        chat: "1703808186"
    };

    function gerarPixMestre(valor) {
        const formatar = (id, conteudo) => `${id}${conteudo.length.toString().padStart(2, '0')}${conteudo}`;
        const valorLimpo = parseFloat(valor).toFixed(2);
        const contaInfo = formatar('00', 'br.gov.bcb.pix') + formatar('01', SANDX_CONFIG.pix);
        let payload = "000201" + formatar('26', contaInfo) + "520400005303986" + formatar('54', valorLimpo) + "5802BR" + formatar('59', SANDX_CONFIG.beneficiario) + formatar('60', SANDX_CONFIG.cidade) + "62070503***6304";
        let crc = 0xFFFF;
        for (let i = 0; i < payload.length; i++) {
            crc ^= payload.charCodeAt(i) << 8;
            for (let j = 0; j < 8; j++) {
                if ((crc & 0x8000) !== 0) crc = (crc << 1) ^ 0x1021;
                else crc <<= 1;
            }
        }
        return payload + (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }

    async function processarLogistica(event) {
        if(event) event.preventDefault();
        const btn = document.getElementById('btnMain');
        btn.innerText = "IA CALCULANDO PREÇOS...";

        const dados = {
            nome: document.getElementById('nomeCliente').value,
            doc: document.getElementById('docCliente').value,
            tel: document.getElementById('telCliente').value,
            cepO: document.getElementById('cepOrigem').value.replace(/\D/g, ''),
            cepD: document.getElementById('cepDestino').value.replace(/\D/g, ''),
            peso: parseFloat(document.getElementById('peso').value),
            alt: parseFloat(document.getElementById('alt').value),
            larg: parseFloat(document.getElementById('larg').value),
            comp: parseFloat(document.getElementById('comp').value)
        };

        // LÓGICA ORIGINAL DE CÁLCULO
        let custoBase = 16.58 + (Math.abs(parseInt(dados.cepO[0] || 0) - parseInt(dados.cepD[0] || 0)) * 3.50) + (dados.peso * 1.75);
        custoBase += ((dados.alt * dados.larg * dados.comp) / 6000) * 3.10;

        // VERIFICAÇÃO DE MESMO CEP (RESTAURADO DO ORIGINAL)
        const prefixoOrigem = dados.cepO.substring(0, 2);
        const prefixoDestino = dados.cepD.substring(0, 2);
        if (prefixoOrigem === prefixoDestino && prefixoOrigem !== "") { 
            custoBase = 14.90 + (dados.peso * 1.50); 
        }

        const tipoServico = document.getElementById('servico').value;
        let multiplicadorUrgencia = 1.0; let taxaFixaServico = 0; let textoPrazo = "3 a 5 dias úteis";

        if (tipoServico === "04014") { 
            multiplicadorUrgencia = 1.80; taxaFixaServico = 12.84; textoPrazo = "1 a 2 dias úteis"; 
        } else if (tipoServico === "moto") { 
            multiplicadorUrgencia = 1.0; taxaFixaServico = 0; custoBase = 9.95; textoPrazo = "ENTREGA HOJE (Same Day)"; 
        }

        document.getElementById('prazoTexto').innerText = textoPrazo;
        document.getElementById('prazoVisual').classList.remove('hidden');

        const custoProcessado = (custoBase * multiplicadorUrgencia) + taxaFixaServico + 4.00;
        const valorFinal = (custoProcessado * 1.45).toFixed(2);
        const pix = gerarPixMestre(valorFinal);

        document.getElementById('displayValores').classList.remove('hidden');
        document.getElementById('valorBase').innerText = `R$ ${custoProcessado.toFixed(2).replace('.', ',')}`;
        document.getElementById('valorFinal').innerText = `R$ ${valorFinal.replace('.', ',')}`;
        document.getElementById('qrCodePix').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(pix)}`;
        
        btn.innerText = "AGUARDANDO PAGAMENTO...";

        // RELATÓRIO COMPLETO PARA TELEGRAM (IGUAL AO ORIGINAL)
        if(event) {
            let nomeServico = (tipoServico === "04014") ? "⚡ SEDEX" : (tipoServico === "moto" ? "🏍️ MOTO" : "📦 PAC");
            const msg = `🚀 *NOVA LOGÍSTICA - ${nomeServico}*\n👤 *CLIENTE:* ${dados.nome}\n📄 *DOC:* ${dados.doc}\n📞 *WhatsApp:* ${dados.tel}\n📍 *CEP:* ${dados.cepD}\n⚖️ *PESO:* ${dados.peso}kg\n💰 *VALOR:* R$ ${valorFinal.replace('.', ',')}\n\n🔗 *PIX:* \`${pix}\``;
            
            fetch(`https://api.telegram.org/bot${SANDX_CONFIG.token}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ chat_id: SANDX_CONFIG.chat, text: msg, parse_mode: 'Markdown' })
            });
        }
    }

    document.querySelectorAll('.recalc').forEach(el => el.addEventListener('change', () => processarLogistica(null)));

    setInterval(() => {
        const agora = new Date();
        document.getElementById('currentDate').innerText = agora.toLocaleDateString('pt-BR');
        document.getElementById('currentTime').innerText = agora.toLocaleTimeString('pt-BR');
    }, 1000);
    </script>
</body>
</html>
